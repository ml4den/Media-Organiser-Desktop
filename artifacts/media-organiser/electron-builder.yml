appId: com.mediaorganiser.desktop
productName: Media Organiser
copyright: Copyright © 2026 Media Organiser contributors
directories:
  output: ../../generated-artifacts/desktop
files:
  - desktop/**/*
  - shared/**/*
  - dist/public/**/*
  - "!dist/public/Media-Organiser-Desktop.zip"
  - "!dist/public/downloads/**/*"
  - package.json
extraResources:
  - from: runtime
    to: runtime
asar: true
asarUnpack:
  - node_modules/exiftool-vendored*/**/*
  - "**/node_modules/exiftool-vendored*/**/*"
npmRebuild: false
mac:
  minimumSystemVersion: "15.0"
  category: public.app-category.photography
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Photography
  target:
    - AppImage

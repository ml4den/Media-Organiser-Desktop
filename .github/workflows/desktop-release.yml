name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/media-organiser desktop:build
      - run: pnpm --filter @workspace/media-organiser desktop:export
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-source
          path: artifacts/media-organiser/public/Media-Organiser-Desktop.zip
  package:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: desktop-source
      - name: Extract standalone project
        shell: pwsh
        run: Expand-Archive Media-Organiser-Desktop.zip -DestinationPath source
      - name: Install build tools (end users do not need these)
        working-directory: source/Media-Organiser
        run: npm install
      - name: Package with bundled runtime
        working-directory: source/Media-Organiser
        run: npm run package
      - name: Check Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64
          # CI runner namespace policy is not a desktop sandbox compatibility check.
          xvfb-run -a generated-artifacts/desktop/linux-unpacked/media-organiser --no-sandbox --disable-gpu --smoke-test
      - name: Check macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary=$(find generated-artifacts/desktop -path '*/MacOS/Media Organiser' -type f | head -1)
          "$binary" --smoke-test
      - name: Check Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem generated-artifacts/desktop -Recurse -Filter 'Media Organiser.exe' | Select-Object -First 1
          $process = Start-Process $app.FullName -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke check failed' }
      - name: Generate download manifest and checksums
        working-directory: source/Media-Organiser
        run: node desktop/publish-downloads.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            generated-artifacts/desktop/*.AppImage
            generated-artifacts/desktop/*.exe
            generated-artifacts/desktop/*.dmg
            source/Media-Organiser/public/downloads/SHA256SUMS.txt
            source/Media-Organiser/public/downloads/releases.json
          if-no-files-found: error

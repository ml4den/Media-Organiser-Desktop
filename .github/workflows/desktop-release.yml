name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Match the release tag to the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./artifacts/media-organiser/package.json').version")
          test "$GITHUB_REF_NAME" = "desktop-v$version" || {
            echo "Tag $GITHUB_REF_NAME must match desktop-v$version" >&2
            exit 1
          }
      - run: pnpm --filter @workspace/media-organiser desktop:build
      - run: pnpm --filter @workspace/media-organiser desktop:export
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-source
          path: artifacts/media-organiser/public/Media-Organiser-Desktop.zip
  package:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: desktop-source
      - name: Extract standalone project
        shell: pwsh
        run: Expand-Archive Media-Organiser-Desktop.zip -DestinationPath source
      - name: Install build tools (end users do not need these)
        working-directory: source/Media-Organiser
        run: npm install
      - name: Package with bundled runtime
        working-directory: source/Media-Organiser
        run: npm run package
      - name: Check Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64
          # CI runner namespace policy is not a desktop sandbox compatibility check.
          xvfb-run -a generated-artifacts/desktop/linux-unpacked/media-organiser --no-sandbox --disable-gpu --smoke-test
      - name: Check macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary=$(find generated-artifacts/desktop -path '*/MacOS/Media Organiser' -type f | head -1)
          "$binary" --smoke-test
      - name: Check Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem generated-artifacts/desktop -Recurse -Filter 'Media Organiser.exe' | Select-Object -First 1
          $process = Start-Process $app.FullName -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke check failed' }
      - name: Generate download manifest and checksums
        working-directory: source/Media-Organiser
        run: node desktop/publish-downloads.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            generated-artifacts/desktop/*.AppImage
            generated-artifacts/desktop/*.exe
            generated-artifacts/desktop/*.dmg
            generated-artifacts/desktop/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - name: Validate, checksum and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          shopt -s nullglob
          assets=(release-assets/Media-Organiser-"$version"-*)
          if [[ ${#assets[@]} -ne 6 ]]; then
            printf 'Expected 6 installer files for version %s, found %s:\n' "$version" "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi
          for expected in \
            "Media-Organiser-$version-linux-x86_64.AppImage" \
            "Media-Organiser-$version-win-x64.exe" \
            "Media-Organiser-$version-mac-arm64.dmg" \
            "Media-Organiser-$version-mac-arm64.zip" \
            "Media-Organiser-$version-mac-x64.dmg" \
            "Media-Organiser-$version-mac-x64.zip"; do
            test -f "release-assets/$expected" || {
              echo "Required release package is missing: $expected" >&2
              exit 1
            }
          done
          (cd release-assets && sha256sum Media-Organiser-"$version"-* > SHA256SUMS.txt)
          cat > release-notes.md <<'EOF'
          Self-contained desktop downloads for Windows, macOS and Linux. SHA-256 checksums are attached.

          **macOS:** These test builds are ad-hoc signed but not Apple-notarised. Gatekeeper may still prevent them from opening. Do not disable Gatekeeper. A public release with normal first-open behavior requires Developer ID signing and Apple notarisation.

          Run the app on copies of a small media folder first. Check the Help page for platform requirements and instructions.
          EOF
          gh release create "$GITHUB_REF_NAME" release-assets/Media-Organiser-"$version"-* release-assets/SHA256SUMS.txt \
            --verify-tag \
            --title "Media Organiser $version" \
            --notes-file release-notes.md
